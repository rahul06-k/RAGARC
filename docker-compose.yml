version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: college_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: college_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend & RAG Engine
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: college_rag_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/college_rag
      SECRET_KEY: college-rag-super-secret-jwt-key-2026-production-ready-token
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: sentence_transformers
      CHROMA_PERSIST_DIR: /app/chroma_data
      UPLOAD_DIR: /app/uploaded_documents
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - uploaded_documents:/app/uploaded_documents
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: college_rag_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
  uploaded_documents:
